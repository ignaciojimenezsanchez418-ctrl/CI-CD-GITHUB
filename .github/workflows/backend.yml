name: Backend CI

# Compila y prueba el backend en cada push y pull request que lo toque.
# Si se marca como check obligatorio en la protección de main, "main siempre compila" (sección 15).
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar paquetes y herramientas
        run: |
          dotnet restore FinDash.slnx
          dotnet tool restore

      - name: Compilar
        run: dotnet build FinDash.slnx --no-restore --configuration Release

      - name: Revisar que no falten migraciones
        # Falla si alguien cambió las entidades y olvidó "dotnet ef migrations add".
        run: dotnet ef migrations has-pending-model-changes --project src/FinDash.Api --no-build --configuration Release

      - name: Pruebas
        run: dotnet test FinDash.slnx --no-build --configuration Release --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      - name: Subir resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: backend/TestResults/*.trx
          retention-days: 7
